      - id
      - permission_overrides
      - permissions
      - roles
      - username
    UserList:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        roles:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - email
      - id
      - is_active
      - roles
      - username
    Vente:
      type: object
      description: |-
        Write-only path (`create`/`update`) — `VenteViewSet.list`/`retrieve`
        use `VenteReadSerializer` (backed by the `VenteListView` DB view)
        instead, so this doesn't need a `customer_name` resolved field.
      properties:
        id:
          type: string
          readOnly: true
        customer:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/VenteStatusEnum'
          readOnly: true
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        discount_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        subtotal_ht:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        tva_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        expected_delivery_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/VenteLigne'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer
      - discount_amount
      - id
      - lines
      - status
      - subtotal_ht
      - total
      - tva_amount
      - updated_at
    VenteLigne:
      type: object
      description: |-
        Write-only path, nested in `VenteSerializer` — `product_name`/
        `product_sku` aren't needed here, `VenteLigneReadSerializer` (backed by
        the `VenteLigneListView` DB view) carries those for `list`/`retrieve`.
      properties:
        id:
          type: string
        product:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        discount_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        tva_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
      required:
      - product
      - quantity
      - unit_price
    VenteLigneRead:
      type: object
      description: |-
        Backed by `VenteLigneListView` (DB view) — `product_name`/`product_sku`
        come from the view's join, not a per-request lookup or a client-side
        fetch-everything-and-resolve.
      properties:
        id:
          type: string
          maxLength: 20
        product:
          type: string
          maxLength: 20
        product_name:
          type: string
          maxLength: 255
        product_sku:
          type: string
          maxLength: 64
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        discount_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        tva_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
      required:
      - discount_percent
      - id
      - product
      - product_name
      - product_sku
      - quantity
      - tva_rate
      - unit_price
    VenteRead:
      type: object
      description: |-
        Backed by `VenteListView` (DB view) — used for `list`/`retrieve` only
        (`VenteViewSet.get_serializer_class`). `customer_name` comes from the
        view's join; `create`/`update`/`valider`/`annuler` go through the
        writable `Vente` model + `VenteSerializer` instead.
      properties:
        id:
          type: string
          maxLength: 20
        customer:
          type: string
          maxLength: 20
        customer_name:
          type: string
          maxLength: 255
        status:
          type: string
          maxLength: 50
        priority:
          type: string
          maxLength: 10
        currency:
          type: string
          maxLength: 3
        discount_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        subtotal_ht:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        tva_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        expected_delivery_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/VenteLigneRead'
          readOnly: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - currency
      - customer
      - customer_name
      - discount_amount
      - discount_percent
      - id
      - lines
      - notes
      - priority
      - status
      - subtotal_ht
      - total
      - tva_amount
      - updated_at
    VenteStatusEnum:
      enum:
      - draft
      - validated
      - cancelled
      type: string
      description: |-
        * `draft` - Brouillon
        * `validated` - Validée
        * `cancelled` - Annulée
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
